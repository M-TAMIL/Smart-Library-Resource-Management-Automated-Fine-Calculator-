# ========================================================
# Smart Library Resource Management & Automated Fine Calculator
# Application Configuration
# ========================================================

server.port=8080
spring.application.name=Smart-Library-Management

# --------------------------------------------------------
# MySQL Database Configuration
# Database credentials can be supplied through environment variables.
# Can be overridden using environment variables
# --------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_library}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------------
# JPA / Hibernate Configuration
# --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# --------------------------------------------------------
# Default Business Rules
# --------------------------------------------------------
library.fine.default-rate-per-day=5.00
library.fine.default-grace-period=0
library.fine.default-max-fine=100.00
library.borrow.default-period-days=14

# --------------------------------------------------------
# Static resources and web configuration
# --------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:frontend/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# --------------------------------------------------------
# Logging Configuration
# --------------------------------------------------------
logging.level.com.library.smartlibrary=INFO
logging.level.org.hibernate.SQL=DEBUG
